name: HOWLREX Auto Recovery
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch golden backup
        run: git fetch origin howlrex-golden-backup:refs/remotes/origin/howlrex-golden-backup
      - name: Restore protected files when tampered
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            styles.css
            script.js
            vercel.json
            robots.txt
            SECURITY.md
            SECURITY-MANIFEST.json
            .github/CODEOWNERS
          )
          changed=0
          for f in "${files[@]}"; do
            if ! git diff --quiet origin/howlrex-golden-backup -- "$f"; then
              git checkout origin/howlrex-golden-backup -- "$f"
              changed=1
            fi
          done
          if [ "$changed" -eq 0 ]; then
            echo "HOWLREX protected files match the golden backup."
            exit 0
          fi
          git config user.name "HOWLREX Recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js vercel.json robots.txt SECURITY.md SECURITY-MANIFEST.json .github/CODEOWNERS
          git commit -m "Auto-recover protected HowlRex files"
          git push origin HEAD:main
