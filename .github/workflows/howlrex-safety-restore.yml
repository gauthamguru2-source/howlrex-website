name: HOWLREX Safety Restore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESTORE to reconstruct the verified baseline"
        required: true
        type: string

permissions:
  contents: write

jobs:
  restore:
    if: ${{ inputs.confirm == 'RESTORE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Restore verified baseline
        env:
          BASELINE_BRANCH: howlrex-original-baseline-2026-10-03
          BASELINE_COMMIT: 98dbf54a35783056baa74238c69a8cf3358403bd
        run: |
          set -euo pipefail
          git fetch origin "${BASELINE_BRANCH}" --depth=1
          git fetch origin "${BASELINE_COMMIT}" --depth=1 || true

          git checkout "${BASELINE_BRANCH}" -- .
          git add -A
          if git diff --cached --quiet; then
            echo "Baseline already matches main."
            exit 0
          fi

          git -c user.name="howlrex-safety-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Safety restore: verified HowlRex baseline"
          git push origin HEAD:main

      - name: Report
        run: echo "Safety restore completed against the verified baseline.";
